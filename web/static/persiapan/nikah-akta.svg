<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Inter,Arial,sans-serif">
  <rect width="400" height="300" fill="#f1f5f2"/>
  <!-- buku nikah suami (cokelat) & istri (hijau) -->
  <g transform="translate(40,50) rotate(-6)">
    <rect width="110" height="150" rx="8" fill="#7a4a24"/>
    <text x="55" y="40" text-anchor="middle" fill="#f3d79a" font-size="10" font-weight="700">BUKU NIKAH</text>
    <circle cx="55" cy="80" r="18" fill="none" stroke="#f3d79a" stroke-width="2"/>
    <text x="55" y="130" text-anchor="middle" fill="#f3d79a" font-size="8">SUAMI</text>
  </g>
  <g transform="translate(120,58) rotate(4)">
    <rect width="110" height="150" rx="8" fill="#1f6b46"/>
    <text x="55" y="40" text-anchor="middle" fill="#f3d79a" font-size="10" font-weight="700">BUKU NIKAH</text>
    <circle cx="55" cy="80" r="18" fill="none" stroke="#f3d79a" stroke-width="2"/>
    <text x="55" y="130" text-anchor="middle" fill="#f3d79a" font-size="8">ISTRI</text>
  </g>
  <!-- akta kelahiran -->
