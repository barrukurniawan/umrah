    <g stroke="#e5e7eb" stroke-width="3"><path d="M20 70h80M20 84h80M20 98h64M20 112h80M20 126h52"/></g>
  </g>
  <text x="200" y="250" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">Bawa yang asli + fotokopi, sesuai permintaan travel</text>
  <rect x="300" y="8" width="86" height="22" rx="11" fill="#fff"/>
  <text x="343" y="23" text-anchor="middle" fill="#0f5a3d" font-size="10" font-weight="700">CONTOH</text>
