    <rect x="8" y="8" width="104" height="152" rx="2" fill="none" stroke="#c7a85a" stroke-width="2"/>
    <text x="60" y="36" text-anchor="middle" fill="#111827" font-size="9" font-weight="800">KUTIPAN AKTA</text>
