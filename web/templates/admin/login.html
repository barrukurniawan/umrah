<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Umrohku</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{cssV}}">
</head>

<body class="min-h-screen bg-emerald-50/40 flex items-center justify-center px-4">
    <form method="POST" action="/admin/login" class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-sm p-6">
        <div class="flex items-center gap-2 mb-1">
            <img src="/static/logo.png" alt="" class="w-7 h-7">
            <h1 class="text-xl font-bold text-emerald-700">Umrohku Admin</h1>
        </div>
        <p class="text-sm text-gray-500 mb-5">Masuk untuk melihat trafik & klik travel.</p>

        {{if not .Configured}}
        <p class="text-sm bg-amber-50 text-amber-800 border border-amber-200 rounded-lg p-3 mb-4">
            Admin belum dikonfigurasi: isi <code>ADMIN_PASSWORD_HASH</code> di file <code>.env</code> server.
        </p>
        {{end}}
        {{if .Error}}
        <p class="text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-lg p-3 mb-4">{{.Error}}</p>
        {{end}}

        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg py-2.5 transition-colors">Masuk</button>
    </form>
</body>

</html>
