        <details class="relative" id="userMenu">
            <summary class="list-none flex items-center gap-2 cursor-pointer rounded-full border border-gray-200 pl-1 pr-3 py-1 hover:border-emerald-300">
                {{if .User.Picture}}<img src="{{.User.Picture}}" alt="" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full">

                <span class="hidden sm:inline text-sm font-medium text-gray-700 max-w-[120px] truncate">{{firstName .User.Name}}</span>

                <a href="/akun" class="flex items-center gap-2 px-4 py-2 hover:bg-emerald-50">⚙︎ Akun &amp; privasi</a>
