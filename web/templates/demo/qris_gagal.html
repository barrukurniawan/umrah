<main class="max-w-md mx-auto px-4 py-10">
    <section class="rounded-3xl bg-white ring-1 ring-gray-200 p-6 text-center">
        <span class="mx-auto w-14 h-14 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">{{template "tabicon" (dict "N" "qr" "C" "w-7 h-7")}}</span>
        <h1 class="mt-3 text-lg font-bold text-gray-900">{{if .NotQRIS}}Ini bukan QRIS{{else}}QRIS tidak valid{{end}}</h1>
        <p class="mt-1 text-sm text-gray-500">{{if .NotQRIS}}QR terbaca, tapi isinya bukan kode pembayaran QRIS.{{else}}{{.Reason}}{{end}}</p>
        {{if .Raw}}<p class="mt-4 rounded-xl bg-gray-50 px-3 py-2.5 text-left font-mono text-xs text-gray-600 break-all max-h-32 overflow-y-auto">{{.Raw}}</p>{{end}}
        {{if .IsURL}}<a href="{{.Raw}}" target="_blank" rel="noopener nofollow" class="mt-3 inline-block text-sm font-semibold text-emerald-700 hover:underline">Buka tautan ↗</a>{{end}}
        <a href="/bayar" class="mt-5 block rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3">Scan lagi</a>
    </section>
</main>
